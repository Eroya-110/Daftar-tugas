<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Tugas</title>
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>
    <div class="container">
        <h1>Daftar Tugas</h1>

        <div class="card">
            <div class="form-group">
                <label for="taskName">Nama Tugas</label>
                <input type="text" id="taskName">
            </div>
            <div class="form-group">
                <label for="taskDetail">Detail Tugas</label>
              <textarea id="taskDetail"></textarea>
            </div>
            <div class="form-group">
              <label for="taskDeadline">Tenggat waktu</label>
               <input type="datetime-local" id="taskDeadline">
            </div>
            <button class="btn-primary" onclick="addTask()">➕ Tambah Tugas</button>
        </div>

        <div class="tabs">
            <button class="tab active" id="btn-all" onclick="setFilter('all')">Semua</button>
            <button class="tab" id="btn-active" onclick="setFilter('active')">Belum</button>
            <button class="tab" id="btn-completed" onclick="setFilter('completed')">Selesai</button>
        </div>

        <div class="task-list" id="taskList"></div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <p>Belum ada tugas.</p>
        </div>

        <div class="stats">
            <div><span class="active-count" id="countActive">0</span> belum selesai</div>
            <div><span class="done-count" id="countDone">0</span> selesai</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
